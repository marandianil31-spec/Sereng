name: Flutter CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout project
      - uses: actions/checkout@v4

      # Setup Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Analyze project
      - name: Analyze
        run: flutter analyze

      # Run tests
      - name: Run tests
        run: flutter test

      # Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # Create Debug Keystore
      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android

          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Show SHA-1 and SHA-256
      - name: Get SHA Fingerprints
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      # Create GitHub Release
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_id }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "SERENG v1.0.${{ github.run_id }}" \
            --notes "SERENG Android APK"
