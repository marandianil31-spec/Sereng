name: Create SERENG Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:

      # Create permanent release keystore
      - name: Create Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore sereng-release.jks \
            -alias sereng \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SerengStore12345 \
            -keypass SerengKey12345 \
            -dname "CN=SERENG, OU=SERENG, O=SERENG, L=Giridih, ST=Jharkhand, C=IN"

      # Show SHA-1 and SHA-256
      - name: Show SHA Fingerprints
        run: |
          keytool -list -v \
            -keystore sereng-release.jks \
            -alias sereng \
            -storepass SerengStore12345 \
            -keypass SerengKey12345

      # Upload keystore as artifact
      - name: Upload Release Keystore
        uses: actions/upload-artifact@v4
        with:
          name: sereng-release-keystore
          path: sereng-release.jks
          retention-days: 30
